# git-chglog configuration for the notes of a single GitHub release.
# Shares the parsing rules with config.yml; renders only one version, and
# without the changelog preamble.
style: github
template: RELEASE.tpl.md
info:
  repository_url: https://github.com/treee111/hagerFlow
options:
  sort: "semver"
  commits:
    sort_by: "Author.Date"
    filters:
      Type:
        - FEAT
        - FIX
        - DEV
        - DOC
        - BREAKING
  commit_groups:
    sort_by: Custom
    title_order:
      - BREAKING
      - FEAT
      - FIX
      - DEV
      - DOC
    title_maps:
      FEAT: Features
      FIX: Bug Fixes
      DEV: Development/Infrastructure/Test/CI
      DOC: Documentation
      BREAKING: Breaking Changes
  header:
    # "[TYPE] scope: subject", with the scope optional.
    pattern: "^\\[(\\w*)\\]\\s(?:([^\\:]*)\\:\\s)?(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  issues:
    prefix:
      - "#"
  notes:
    keywords:
      - BREAKING CHANGE
